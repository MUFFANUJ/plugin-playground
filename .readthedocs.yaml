version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "mambaforge-4.10"
  jobs:
    post_create_environment:
      - python -m pip install --force-reinstall --no-deps --no-build-isolation jupyterlab==4.7.0a0 jupyterlite-javascript-kernel==0.4.0a5

conda:
  environment: docs/environment.yml

submodules:
  include: all
  recursive: true

sphinx:
   configuration: docs/conf.py
